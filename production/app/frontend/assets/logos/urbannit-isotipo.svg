<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Urbannit — isotipo "cerradura", trazo abierto (D-035, 2026-08-09). Color por defecto: Ka'a verde #45573A -->
  <!-- Mismo lenguaje de trazo abierto que el mojon de Meridiano (coherencia marca madre / sub-marca). -->
  <!-- El ojo de la cerradura se ve de verdad: es un anillo sin relleno, no un circulo solido. -->
  <circle cx="50" cy="35" r="14" fill="none" stroke="#45573A" stroke-width="6"/>
  <path d="M50 48 L64 80 L36 80 Z" fill="none" stroke="#45573A" stroke-width="6" stroke-linejoin="round"/>
</svg>
